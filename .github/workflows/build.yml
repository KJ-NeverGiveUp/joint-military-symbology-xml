name: Build JMSML

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019 # 改用 2019 版本，內建完整的舊版 .NET Framework 支援

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Restore NuGet Packages
      run: nuget restore source/JointMilitarySymbologyLibraryCS/JointMilitarySymbologyLibrary.sln

    - name: Build Solution
      run: msbuild source/JointMilitarySymbologyLibraryCS/JointMilitarySymbologyLibrary.sln /p:Configuration=Release

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-JMSML
        path: source/JointMilitarySymbologyLibraryCS/**/bin/Release/
