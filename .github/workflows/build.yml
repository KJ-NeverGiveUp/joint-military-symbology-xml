name: Build JMSML

on:
  workflow_dispatch: # 允許在網頁上手動觸發編譯

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore source/JointMilitarySymbologyLibraryCS/JointMilitarySymbologyLibrary.sln

    - name: Build Solution
      run: msbuild source/JointMilitarySymbologyLibraryCS/JointMilitarySymbologyLibrary.sln /p:Configuration=Release /p:TargetFrameworkVersion=v4.8

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-JMSML
        path: source/JointMilitarySymbologyLibraryCS/**/bin/Release/
